<!DOCTYPE html>
<html lang="en">

<body>
    <button onclick="myfunction()">Click me</button>
    <p id="result"></p>
    <script>
        function myfunction() {
            var x = 10;
            var y = 20;
            var a = eval("x + y") + "<br>";
            var b = eval("2 * 2") + "<br>";
            var c = eval("y - x") + "<br>";



            var res = a + b + c;
            document.getElementById("result").innerHTML = res;
        }


    </script>

     <button onclick="ascending()">Ascending order</button>
    <button onclick="decending()">Decendineg order</button>
    <p id="result"></p>
    <script>
        var points = [1,3,5,67,9,7,8,4,6,13,24,112,521,2152,224,52,244454244,222,522,523,512,454**14];
        document.getElementById("result").innerHTML = points;
        function ascending() {
            points.sort(function (a, b) { return a - b }); 
            document.getElementById("result").innerHTML = points;
        }
         function decending() {
            points.sort(function (a, b) { return b - a }); 
            document.getElementById("result").innerHTML = points;
        }
    </script>
   
        
    </body>
</html>
